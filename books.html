<!doctype html>
<html lang="en" dir="ltr" data-theme="light" data-page="books">
  <head>

    <meta name="theme-color" content="#fafafa" />
    <title>My Bookshelf — Ehsan Masoomi</title>
    <script src="./theme-init.js"></script>
    <link rel="stylesheet" href="./styles.css" />

    <link rel="stylesheet" href="./home.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body data-page="books">
    <a class="skip-link" href="#library-content">Skip to main content</a>
    <header class="site-header portal-header" id="top">

        <div class="display-controls" aria-label="Display settings">

      </div>
    </header>
    <main class="library-section" id="library-content" tabindex="-1"></main>
    <footer class="site-footer">
      <p class="copyright"><span>© </span><span id="copyright-year">2026</span><span> Ehsan Masoomi</span></p>
