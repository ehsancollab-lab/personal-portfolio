<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Sign in — Ehsan Portfolio Dashboard</title>
    <link rel="stylesheet" href="/login.css" />
    <script src="/login.js" type="module"></script>
  </head>
  <body>
    <main class="login-card">
      <img class="avatar" src="/assets/figma/profile.png" width="48" height="48" alt="Ehsan Masoomi" />
      <h1>Ehsan Portfolio Dashboard</h1>
      <form id="login-form">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" autofocus />
        <p id="login-error" role="alert" hidden></p>
        <button type="submit">Sign in</button>
      </form>
      <a class="portfolio-link" href="https://ehsandesigns.com/">Back to portfolio</a>
    </main>
  </body>
</html>
