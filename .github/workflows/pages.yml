name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Check dashboard security and content publishing
        run: npm test
      - name: Build public portfolio
        run: npm run build:site
      - name: Upload public site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Cancel an explicitly identified stalled Pages deployment
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[pages-recovery:')
        uses: actions/github-script@v7
        with:
          script: |
            const match = context.payload.head_commit.message.match(/\[pages-recovery:([a-f0-9]{40})\]/);
            if (!match) throw new Error('A recovery push must identify the stalled deployment SHA.');
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
              ...context.repo,
              pages_deployment_id: match[1]
            });
            core.info('Requested cancellation of the stalled Pages deployment.');
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
